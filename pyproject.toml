[project]
name = "cyberrecon"
version = "1.0.0"
description = "Web-based passive vulnerability assessment and reconnaissance platform for authorized HTTP and HTTPS targets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]