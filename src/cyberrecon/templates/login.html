<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | CyberRecon
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<nav class="navbar">

    <div class="brand">
        Cyber<span>Recon</span>
    </div>

    <div class="nav-actions">

        <a
            href="{{ url_for('home') }}"
            class="nav-link"
        >
            Home
        </a>

        <a
            href="{{ url_for('register') }}"
            class="nav-link"
        >
            Register
        </a>

        <div class="nav-status">
            USER LOGIN
        </div>

    </div>

</nav>


<main class="container">


<section class="auth-section">


    <div class="auth-card">


        <div class="tag">
            SECURE ACCESS
        </div>


        <h1>

            Sign in to

            <span>
                CyberRecon.
            </span>

        </h1>


        <p class="auth-subtitle">

            Access your security assessments,
            reports and analytics.

        </p>


        {% if error %}

        <div class="auth-message auth-error">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            class="auth-form"
        >

            {% if request.args.get('next') %}

            <input
                type="hidden"
                name="next"
                value="{{ request.args.get('next') }}"
            >

            {% endif %}


            <label for="email">
                Email Address
            </label>


            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
            >


            <label for="password">
                Password
            </label>


            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                class="auth-button"
            >
                Sign In
            </button>


        </form>


        <p class="auth-note">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create one
            </a>

        </p>


    </div>


</section>


</main>


</body>

</html>
