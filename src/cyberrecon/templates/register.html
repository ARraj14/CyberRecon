<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Register | CyberRecon
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>


<nav class="navbar">

    <div class="brand">

        Cyber<span>Recon</span>

    </div>


    <div class="nav-actions">

        <a
            href="{{ url_for('home') }}"
            class="nav-link"
        >
            Home
        </a>

        <div class="nav-status">

            CREATE ACCOUNT

        </div>

    </div>

</nav>



<main class="container">


<section class="auth-section">


    <div class="auth-card">


        <div class="tag">

            USER ACCESS

        </div>


        <h1>

            Create your

            <span>
                CyberRecon
            </span>

            account.

        </h1>


        <p class="auth-subtitle">

            Create an account to manage
            security assessments,
            historical scans and reports.

        </p>



        {% if error %}

        <div
            class="auth-message auth-error"
        >

            {{ error }}

        </div>

        {% endif %}



        {% if success %}

        <div
            class="auth-message auth-success"
        >

            {{ success }}

        </div>

        {% endif %}



        <form
            method="POST"
            class="auth-form"
        >


            <label for="username">

                Username

            </label>


            <input
                type="text"
                id="username"
                name="username"

                minlength="3"
                maxlength="30"

                pattern="[A-Za-z0-9_-]{3,30}"

                autocomplete="username"

                required
            >



            <label for="email">

                Email Address

            </label>


            <input
                type="email"
                id="email"
                name="email"

                autocomplete="email"

                required
            >



            <label for="password">

                Password

            </label>


            <input
                type="password"
                id="password"
                name="password"

                minlength="8"

                autocomplete="new-password"

                required
            >



            <label for="confirm_password">

                Confirm Password

            </label>


            <input
                type="password"
                id="confirm_password"
                name="confirm_password"

                minlength="8"

                autocomplete="new-password"

                required
            >



            <button
                type="submit"
                class="auth-button"
            >

                Create Account

            </button>


        </form>


        <p class="auth-note">

            Passwords are securely hashed
            before being stored.

        </p>


    </div>


</section>


</main>


</body>

</html>
