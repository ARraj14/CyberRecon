<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Register | CyberRecon
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>
        .auth-container {
            width: min(500px, 92%);
            margin: 60px auto;
        }

        .auth-card {
            padding: 32px;
            border: 1px solid #1d3448;
            border-radius: 12px;
            background: rgba(8, 17, 28, 0.9);
        }

        .auth-card h1 {
            margin-top: 0;
        }

        .auth-form {
            display: grid;
            gap: 18px;
            margin-top: 28px;
        }

        .auth-form label {
            display: block;
            margin-bottom: 7px;
            color: #8295a8;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.6px;
        }

        .auth-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #294258;
            border-radius: 7px;
            background: #08131f;
            color: #d8e4ed;
        }

        .auth-form button {
            padding: 13px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 700;
        }

        .auth-error,
        .auth-success {
            margin-top: 18px;
            padding: 12px;
            border-radius: 7px;
        }

        .auth-error {
            color: #ff8e98;
            background: rgba(150, 35, 45, 0.15);
        }

        .auth-success {
            color: #6de0ae;
            background: rgba(25, 125, 85, 0.15);
        }

        .auth-footer {
            margin-top: 20px;
            color: #8295a8;
        }
    </style>
</head>


<body>

<nav class="navbar">

    <div class="brand">
        Cyber<span>Recon</span>
    </div>

    <div class="nav-actions">

        <a
            href="{{ url_for('home') }}"
            class="nav-link"
        >
            Home
        </a>

        <a
            href="{{ url_for('login') }}"
            class="nav-link"
        >
            Login
        </a>

    </div>

</nav>


<main class="auth-container">

    <div class="auth-card">

        <div class="tag">
            CREATE ACCOUNT
        </div>

        <h1>
            Join
            <span>CyberRecon.</span>
        </h1>

        <p class="subtitle">
            Your assessments and reports are
            isolated to your account.
        </p>


        {% if error %}

        <div class="auth-error">
            {{ error }}
        </div>

        {% endif %}


        {% if success %}

        <div class="auth-success">
            {{ success }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('register') }}"
            class="auth-form"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token }}"
            >


            <div>
                <label for="username">
                    USERNAME
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    minlength="3"
                    maxlength="30"
                    required
                >
            </div>


            <div>
                <label for="email">
                    EMAIL ADDRESS
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required
                >
            </div>


            <div>
                <label for="password">
                    PASSWORD
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </div>


            <div>
                <label for="confirm_password">
                    CONFIRM PASSWORD
                </label>

                <input
                    id="confirm_password"
                    name="confirm_password"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </div>


            <button type="submit">
                Create Account
            </button>

        </form>


        <p class="auth-footer">
            Already registered?
            <a href="{{ url_for('login') }}">
                Login
            </a>
        </p>

    </div>

</main>

</body>

</html>
